<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>专注时钟 · 轻量任务清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f3e8 0%, #f0e9da 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      box-shadow: inset 0 0 80px rgba(160, 120, 80, 0.1);
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 250, 245, 0.85);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: #fffef9;
      border-radius: 3.5rem;
      box-shadow: 0 25px 50px -10px rgba(80, 50, 20, 0.25), 
                  0 0 0 1px rgba(200, 160, 110, 0.3),
                  inset 0 2px 10px rgba(255, 255, 255, 0.8);
      padding: 2.2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      transition: all 0.2s ease;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.8rem;
      }
      .container {
        padding: 1.8rem 1.2rem;
        border-radius: 2.5rem;
      }
    }

    /* 时钟卡片 */
    .timer-section {
      text-align: center;
    }

    .timer-display {
      font-size: 5.2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
      color: #4b3a2b;
      background: #f9efe2;
      border-radius: 3rem;
      padding: 0.5rem 1.2rem;
      display: inline-block;
      margin: 0 auto 1rem;
      box-shadow: inset 0 6px 12px rgba(140, 100, 60, 0.15), 0 10px 15px -5px rgba(100, 70, 30, 0.3);
      background: linear-gradient(180deg, #fdf7f0 0%, #f5e7d6 100%);
      border: 1px solid #e7cfb0;
      line-height: 1.2;
    }

    .mode-label {
      font-size: 1.1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #8b7355;
      background: #efe0cd;
      display: inline-block;
      padding: 0.4rem 1.4rem;
      border-radius: 2rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(5px);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      margin: 1.2rem 0 0.8rem;
    }

    button {
      background: #f5ede1;
      border: none;
      border-radius: 2.5rem;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      font-weight: 550;
      color: #4f3b28;
      background: #ffffff;
      box-shadow: 0 5px 15px rgba(140, 100, 50, 0.15), 0 0 0 1px #ddceb5;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      backdrop-filter: blur(10px);
      letter-spacing: 0.4px;
    }

    button:hover {
      background: #fff7ed;
      box-shadow: 0 8px 18px rgba(150, 100, 40, 0.25), 0 0 0 1.5px #c9aa7a;
      transform: translateY(-1px);
      color: #2f2418;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(120, 80, 30, 0.3);
    }

    button.primary {
      background: #dbb88c;
      color: #2d2416;
      box-shadow: 0 8px 18px rgba(160, 110, 50, 0.35);
      border: 1px solid #b68b5c;
      font-weight: 600;
    }

    button.primary:hover {
      background: #e6c7a2;
    }

    .mode-buttons {
      display: flex;
      gap: 0.5rem;
      background: #f2e7da;
      padding: 0.4rem;
      border-radius: 3rem;
      box-shadow: inset 0 2px 6px rgba(120, 70, 20, 0.2);
    }

    .mode-btn {
      padding: 0.5rem 1.2rem;
      box-shadow: none;
      border-radius: 2.5rem;
      background: transparent;
      border: none;
      font-weight: 500;
      color: #5f4a32;
    }

    .mode-btn.active {
      background: white;
      box-shadow: 0 4px 10px rgba(150, 110, 50, 0.3);
      font-weight: 600;
      color: #3b2c1a;
    }

    /* 任务区域 */
    .task-section {
      background: #faf5ed;
      border-radius: 2.5rem;
      padding: 1.5rem 1.5rem 1.2rem;
      box-shadow: inset 0 2px 10px rgba(200, 160, 110, 0.2), 0 10px 20px -8px rgba(90, 50, 15, 0.25);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .task-header h2 {
      font-size: 1.5rem;
      font-weight: 500;
      color: #4f3b28;
      letter-spacing: 0.5px;
    }

    .add-task-form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.3rem;
    }

    .add-task-form input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 1px solid #ddc7aa;
      border-radius: 2rem;
      background: #fffdf9;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(150, 120, 70, 0.1);
      transition: 0.2s;
      color: #3e3322;
    }

    .add-task-form input:focus {
      border-color: #c49a6c;
      box-shadow: 0 0 0 3px rgba(200, 150, 90, 0.25);
    }

    .task-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 0.4rem;
      border-bottom: 1px solid #eadbc8;
      transition: 0.15s;
      color: #4a3926;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-checkbox {
      width: 1.4rem;
      height: 1.4rem;
      accent-color: #b68b5c;
      cursor: pointer;
      transform: scale(1);
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .task-text.completed {
      text-decoration: line-through;
      color: #b9a48b;
      opacity: 0.75;
    }

    .delete-btn {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0.3rem 0.7rem;
      font-size: 1.2rem;
      color: #b2977a;
      border-radius: 2rem;
      cursor: pointer;
      transition: 0.2s;
      background: #f5ede3;
    }

    .delete-btn:hover {
      background: #f0d9c2;
      color: #a0582c;
      box-shadow: 0 2px 8px rgba(160, 100, 30, 0.3);
    }

    .progress-text {
      font-size: 0.9rem;
      color: #7a684e;
      margin-top: 0.6rem;
      text-align: right;
    }

    .reset-small {
      font-size: 0.9rem;
      padding: 0.5rem 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 专注时钟部分 -->
    <div class="timer-section">
      <div class="mode-label" id="modeDisplay">专注模式</div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      
      <div class="mode-buttons">
        <button id="modeFocus" class="mode-btn active">🍅 专注</button>
        <button id="modeShortBreak" class="mode-btn">☕ 短休</button>
        <button id="modeLongBreak" class="mode-btn">🌿 长休</button>
      </div>

      <div class="controls">
        <button id="startPauseBtn" class="primary">▶ 开始</button>
        <button id="resetTimerBtn" class="reset-small">↺ 重置</button>
      </div>
    </div>

    <!-- 极简任务清单 -->
    <div class="task-section">
      <div class="task-header">
        <h2>📋 今日待办</h2>
      </div>
      
      <div class="add-task-form">
        <input type="text" id="taskInput" placeholder="写下一个任务..." autocomplete="off" />
        <button id="addTaskBtn" style="padding:0.8rem 1.4rem;">➕ 添加</button>
      </div>

      <ul class="task-list" id="taskList">
        <!-- 动态任务渲染 -->
      </ul>
      
      <div class="progress-text" id="progressText">完成 0 / 0</div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 时钟状态 ----------
      const modes = {
        focus: { name: '专注', duration: 25 * 60, display: '专注模式' },
        shortBreak: { name: '短休', duration: 5 * 60, display: '短休模式' },
        longBreak: { name: '长休', duration: 15 * 60, display: '长休模式' }
      };

      let currentMode = 'focus';        // 'focus', 'shortBreak', 'longBreak'
      let timeLeft = modes.focus.duration; // 秒
      let timerInterval = null;
      let isRunning = false;

      // DOM 元素
      const timerDisplay = document.getElementById('timerDisplay');
      const modeDisplay = document.getElementById('modeDisplay');
      const startPauseBtn = document.getElementById('startPauseBtn');
      const resetTimerBtn = document.getElementById('resetTimerBtn');
      const modeFocusBtn = document.getElementById('modeFocus');
      const modeShortBreakBtn = document.getElementById('modeShortBreak');
      const modeLongBreakBtn = document.getElementById('modeLongBreak');

      // 任务相关
      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskList = document.getElementById('taskList');
      const progressText = document.getElementById('progressText');

      // 任务数据存储
      let tasks = [];

      // ---------- 工具函数 ----------
      function formatTime(seconds) {
        if (seconds < 0) seconds = 0;
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        timerDisplay.textContent = formatTime(timeLeft);
      }

      function clearTimerInterval() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function stopTimer() {
        clearTimerInterval();
        isRunning = false;
        startPauseBtn.innerHTML = '▶ 开始';
      }

      // 切换到指定模式 (不自动开始)
      function switchMode(modeKey) {
        if (currentMode === modeKey && isRunning) {
          // 如果相同模式且正在运行，询问是否重启？这里设计为不自动重置，保留运行。但通常模式切换会重置。
          // 按习惯：切换模式时停止计时并重置为新模式时长。
        }
        // 停止任何进行中的计时
        stopTimer();
        currentMode = modeKey;
        timeLeft = modes[modeKey].duration;
        updateTimerDisplay();
        modeDisplay.textContent = modes[modeKey].display;

        // 更新模式按钮激活样式
        [modeFocusBtn, modeShortBreakBtn, modeLongBreakBtn].forEach(btn => btn.classList.remove('active'));
        if (modeKey === 'focus') modeFocusBtn.classList.add('active');
        else if (modeKey === 'shortBreak') modeShortBreakBtn.classList.add('active');
        else if (modeKey === 'longBreak') modeLongBreakBtn.classList.add('active');
      }

      // 开始/暂停
      function toggleStartPause() {
        if (isRunning) {
          // 暂停
          stopTimer();
        } else {
          // 开始
          if (timeLeft <= 0) {
            // 如果时间已经到了，重置为当前模式时长再开始
            timeLeft = modes[currentMode].duration;
            updateTimerDisplay();
          }
          isRunning = true;
          startPauseBtn.innerHTML = '⏸️ 暂停';
          
          timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
              // 时间到
              clearTimerInterval();
              isRunning = false;
              startPauseBtn.innerHTML = '▶ 开始';
              timeLeft = 0;
              updateTimerDisplay();
              
              // 简单的浏览器通知提醒 (如果允许)
              if (Notification && Notification.permission === "granted") {
                new Notification('⏰ 计时结束', { body: `${modes[currentMode].display} 已完成！` });
              } else if (Notification && Notification.permission !== "denied") {
                Notification.requestPermission().then(perm => {
                  if (perm === "granted") {
                    new Notification('⏰ 计时结束', { body: `${modes[currentMode].display} 已完成！` });
                  }
                });
              }
              
              // 也播放轻微提示音（利用 Web Audio 可选，这里简单用 alert 风格？改为更优雅：短暂显示）
              alert(`✨ ${modes[currentMode].display} 时间结束！休息一下或开始下一个任务吧。`);
            }
          }, 1000);
        }
      }

      function resetCurrentTimer() {
        stopTimer();
        timeLeft = modes[currentMode].duration;
        updateTimerDisplay();
        startPauseBtn.innerHTML = '▶ 开始';
      }

      // ---------- 任务逻辑 ----------
      function saveTasksToStorage() {
        localStorage.setItem('focusClockTasks', JSON.stringify(tasks));
      }

      function loadTasksFromStorage() {
        const stored = localStorage.getItem('focusClockTasks');
        if (stored) {
          try {
            tasks = JSON.parse(stored);
          } catch (e) {
            tasks = [];
          }
        } else {
          // 默认示例任务
          tasks = [
            { id: Date.now() + 1, text: '阅读设计文档', completed: false },
            { id: Date.now() + 2, text: '完成代码审查', completed: false }
          ];
        }
      }

      function renderTasks() {
        if (!taskList) return;
        taskList.innerHTML = '';
        
        if (tasks.length === 0) {
          taskList.innerHTML = '<li style="padding:1rem;text-align:center;color:#b9a68b;">✨ 暂无任务，添加一个吧</li>';
          updateProgress();
          return;
        }

        tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-item';
          
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'task-checkbox';
          checkbox.checked = task.completed;
          checkbox.addEventListener('change', (e) => {
            task.completed = e.target.checked;
            saveTasksToStorage();
            renderTasks();
          });

          const span = document.createElement('span');
          span.className = 'task-text' + (task.completed ? ' completed' : '');
          span.textContent = task.text;

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerHTML = '🗑️';
          delBtn.setAttribute('aria-label', '删除任务');
          delBtn.addEventListener('click', () => {
            tasks = tasks.filter(t => t.id !== task.id);
            saveTasksToStorage();
            renderTasks();
          });

          li.appendChild(checkbox);
          li.appendChild(span);
          li.appendChild(delBtn);
          taskList.appendChild(li);
        });

        updateProgress();
      }

      function updateProgress() {
        const total = tasks.length;
        const completedCount = tasks.filter(t => t.completed).length;
        progressText.textContent = `完成 ${completedCount} / ${total}`;
      }

      function addNewTask() {
        const text = taskInput.value.trim();
        if (text === '') {
          alert('请输入任务内容');
          return;
        }
        const newTask = {
          id: Date.now(),
          text: text,
          completed: false
        };
        tasks.push(newTask);
        saveTasksToStorage();
        taskInput.value = '';
        renderTasks();
        // 聚焦回输入框
        taskInput.focus();
      }

      // ---------- 事件绑定 ----------
      // 时钟控制
      startPauseBtn.addEventListener('click', toggleStartPause);
      resetTimerBtn.addEventListener('click', resetCurrentTimer);

      modeFocusBtn.addEventListener('click', () => switchMode('focus'));
      modeShortBreakBtn.addEventListener('click', () => switchMode('shortBreak'));
      modeLongBreakBtn.addEventListener('click', () => switchMode('longBreak'));

      // 任务操作
      addTaskBtn.addEventListener('click', addNewTask);
      taskInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          addNewTask();
        }
      });

      // 初始加载
      loadTasksFromStorage();
      renderTasks();
      // 设置时钟默认显示
      updateTimerDisplay();
      modeDisplay.textContent = modes.focus.display;
      
      // 请求通知权限（静默）
      if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission();
      }

      // 页面关闭或刷新前清理计时器（好习惯）
      window.addEventListener('beforeunload', () => {
        clearTimerInterval();
      });

    })();
  </script>
</body>
</html>

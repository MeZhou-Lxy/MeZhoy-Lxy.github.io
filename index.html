<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>My Pixel Site</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  image-rendering: pixelated; /* 关键：像素风不模糊 */
}
body {
  font-family: "Courier New", monospace;
  background: #1a1a2e;
  color: #fff;
  min-height: 200vh;
  transition: background 0.3s;
  overflow-x: hidden;
}
/* 星空背景 */
#stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}
/* 主容器 */
.container {
  max-width: 600px;
  margin: 100px auto;
  padding: 20px;
}
/* 像素头像 */
.pixel-avatar {
  width: 120px;
  height: 120px;
  background: #ff9ff3;
  border-radius: 8px;
  margin: 30px auto;
  position: relative;
  cursor: pointer;
}
.eye {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #000;
  top: 40px;
  border-radius: 50%;
}
.eye.left { left: 28px; }
.eye.right { right: 28px; }
.mouth {
  position: absolute;
  width: 24px;
  height: 8px;
  background: #000;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 0 0 20px 20px;
}
/* 互动状态 */
.pixel-avatar.blink .eye { height: 2px; }
.pixel-avatar.shy { background: #f368e0; }
.pixel-avatar.shy .mouth { height: 4px; border-radius: 20px; }

/* 像素猫 */
#pixel-cat {
  position: fixed;
  width: 40px;
  height: 30px;
  background: #ff9ff3;
  bottom: 100px;
  left: 100px;
  z-index: 10;
}

/* 留言板 */
.chat-box {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 280px;
  background: #222;
  border: 2px solid #fff;
  padding: 10px;
  border-radius: 6px;
}
.chat-messages {
  height: 120px;
  overflow-y: auto;
  margin-bottom: 8px;
  font-size: 12px;
}
.chat-input {
  width: 100%;
  background: #111;
  color: #fff;
  border: 1px solid #fff;
  padding: 4px;
  font-family: monospace;
}
</style>
</head>

<body>
<div id="stars"></div>

<div class="container">
  <h1 style="text-align:center;">MY PIXEL WORLD</h1>

  <!-- 像素头像：hover 眨眼+害羞 -->
  <div class="pixel-avatar" id="avatar" onclick="playVoice()">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>

  <div style="text-align:center; margin-top:20px;">
    点我有语音 / 鼠标碰我会害羞
  </div>
</div>

<!-- 闲逛的像素小猫 -->
<div id="pixel-cat"></div>

<!-- 右下角留言板 -->
<div class="chat-box">
  <div class="chat-messages" id="msg"></div>
  <input class="chat-input" id="chatInput" placeholder="输入留言…">
</div>

<script>
// ======================
// 1. 头像：眨眼 + 害羞
// ======================
const avatar = document.getElementById('avatar');
avatar.addEventListener('mouseenter', () => {
  avatar.classList.add('blink', 'shy');
});
avatar.addEventListener('mouseleave', () => {
  avatar.classList.remove('blink', 'shy');
});

// ======================
// 2. 点击播放语音（换成你自己的音频地址）
// ======================
function playVoice() {
  const audio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
  audio.play();
}

// ======================
// 3. 滚动背景渐变 + 星空流动
// ======================
window.addEventListener('scroll', () => {
  const per = window.scrollY / (document.body.scrollHeight - window.innerHeight);
  const r = Math.round(26 + per * 20);
  const g = Math.round(26 + per * 40);
  const b = Math.round(46 + per * 80);
  document.body.style.background = `rgb(${r},${g},${b})`;
});

// ======================
// 4. 像素猫随机闲逛
// ======================
const cat = document.getElementById('pixel-cat');
function walkCat() {
  const x = Math.random() * (window.innerWidth - 40);
  const y = Math.random() * (window.innerHeight - 200);
  cat.style.left = x + 'px';
  cat.style.bottom = y + 'px';
  setTimeout(walkCat, 3000 + Math.random() * 4000);
}
walkCat();

// ======================
// 5. 留言板
// ======================
const chatInput = document.getElementById('chatInput');
const msg = document.getElementById('msg');
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const text = chatInput.value.trim();
    if (!text) return;
    msg.innerHTML += `> ${text}<br>`;
    msg.scrollTop = msg.scrollHeight;
    chatInput.value = '';
  }
});
</script>
</body>
</html>

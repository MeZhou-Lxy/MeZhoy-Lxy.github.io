<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeZhoy-Lxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{
  --bg:#111827;
  --text:#e5e7eb;
  --card:#1f2937;
  --muted:#9ca3af;
  --btn:#2563eb;
  --btn-hover:#1d4ed8;
  --nav:#1f2937dd;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f9fafb;
    --text:#111827;
    --card:#ffffff;
    --muted:#6b7280;
    --btn:#2563eb;
    --btn-hover:#1d4ed8;
    --nav:#ffffffdd;
  }
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
#canvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}
nav{
  position:fixed;
  top:0;left:0;
  width:100%;
  padding:16px 24px;
  background:var(--nav);
  backdrop-filter: blur(8px);
  z-index:2;
}
.nav-wrap{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-weight:bold;font-size:1.1rem;color:var(--text)}
.nav-links a{
  color:var(--text);
  text-decoration:none;
  margin-left:20px;
  opacity:0.85;
  transition:0.2s;
}
.nav-links a:hover{opacity:1}
.card{
  background:var(--card);
  padding:40px 30px;
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,0.18);
  position:relative;
  z-index:1;
  margin-top:60px;
}
h1{font-size:2.2rem;margin-bottom:12px}
p{color:var(--muted);margin-bottom:24px;line-height:1.6}
a.btn{
  display:inline-block;
  padding:10px 22px;
  background:var(--btn);
  color:#fff;
  text-decoration:none;
  border-radius:99px;
  transition:0.2s;
  margin:0 6px;
}
a.btn:hover{background:var(--btn-hover)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<nav>
  <div class="nav-wrap">
    <div class="logo">MeZhoy-Lxy</div>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="#">博客</a>
      <a href="#">项目</a>
      <a href="#">友链</a>
      <a href="https://github.com/MeZhou-Lxy">GitHub</a>
    </div>
  </div>
</nav>
<div class="card">
<h1>👋 Hello，我是 MeZhoy-Lxy</h1>
<p>欢迎来到我的 GitHub Pages 个人主页</p>
<div>
  <a class="btn" href="https://github.com/MeZhou-Lxy">GitHub</a>
  <a class="btn" href="#">博客</a>
</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w,h;
let dots = [];
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
class Dot{
  constructor(){
    this.x = Math.random()*w;
    this.y = Math.random()*h;
    this.r = Math.random()*1.2+0.3;
    this.vx = (Math.random()-0.5)*0.4;
    this.vy = (Math.random()-0.5)*0.4;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    if(this.x<0||this.x>w) this.vx*=-1;
    if(this.y<0||this.y>h) this.vy*=-1;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(148,163,184,0.55)';
    ctx.fill();
  }
}
for(let i=0;i<80;i++) dots.push(new Dot());
function link(){
  for(let i=0;i<dots.length;i++){
    for(let j=i+1;j<dots.length;j++){
      const dx = dots[i].x-dots[j].x;
      const dy = dots[i].y-dots[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d<100){
        ctx.beginPath();
        ctx.moveTo(dots[i].x,dots[i].y);
        ctx.lineTo(dots[j].x,dots[j].y);
        ctx.strokeStyle = `rgba(148,163,184,${(100-d)/400})`;
        ctx.lineWidth = 0.4;
        ctx.stroke();
      }
    }
  }
}
function tick(){
  ctx.clearRect(0,0,w,h);
  dots.forEach(d=>{d.update();d.draw();})
  link();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>

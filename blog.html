<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 | MeZhoy-Lxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{
  --bg:#111827;
  --text:#e5e7eb;
  --card:#1f2937;
  --muted:#9ca3af;
  --btn:#2563eb;
  --btn-hover:#1d4ed8;
  --nav:#1f2937dd;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f9fafb;
    --text:#111827;
    --card:#ffffff;
    --muted:#6b7280;
    --btn:#2563eb;
    --btn-hover:#1d4ed8;
    --nav:#ffffffdd;
  }
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  padding-top:80px;
  padding-bottom:40px;
  position:relative;
  overflow-x:hidden;
}
#canvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}
nav{
  position:fixed;
  top:0;left:0;
  width:100%;
  padding:16px 24px;
  background:var(--nav);
  backdrop-filter: blur(8px);
  z-index:2;
}
.nav-wrap{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-weight:bold;font-size:1.1rem;color:var(--text)}
.nav-links a{
  color:var(--text);
  text-decoration:none;
  margin-left:20px;
  opacity:0.85;
  transition:0.2s;
}
.nav-links a:hover{opacity:1}
.nav-links a.active{opacity:1;font-weight:bold}
.container{
  max-width:800px;
  margin:0 auto;
  padding:0 20px;
  position:relative;
  z-index:1;
}
.page-title{
  font-size:2rem;
  margin-bottom:30px;
  text-align:center;
}
.article-item{
  background:var(--card);
  padding:24px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,0.12);
  transition:0.2s;
}
.article-item:hover{transform:translateY(-3px)}
.article-item a{
  color:var(--text);
  text-decoration:none;
}
.article-title{
  font-size:1.25rem;
  margin-bottom:8px;
}
.article-desc{
  color:var(--muted);
  font-size:0.95rem;
  line-height:1.6;
}
.article-date{
  margin-top:10px;
  font-size:0.85rem;
  color:var(--muted);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<nav>
  <div class="nav-wrap">
    <div class="logo">MeZhoy-Lxy</div>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="blog.html" class="active">博客</a>
      <a href="#">项目</a>
      <a href="#">友链</a>
      <a href="https://github.com/MeZhou-Lxy">GitHub</a>
    </div>
  </div>
</nav>
<div class="container">
  <h1 class="page-title">📝 我的博客</h1>
  <div class="article-item">
    <a href="#">
      <h2 class="article-title">第一篇测试文章</h2>
      <p class="article-desc">这是一篇测试博客文章，你后续可以新增md或者html文章，在这里加上链接。</p>
      <div class="article-date">2026-11-09</div>
    </a>
  </div>
  <div class="article-item">
    <a href="#">
      <h2 class="article-title">GitHub Pages 搭建记录</h2>
      <p class="article-desc">记录从本地git、SSH密钥到部署个人站点的全过程。</p>
      <div class="article-date">2026-11-09</div>
    </a>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w,h;
let dots = [];
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
class Dot{
  constructor(){
    this.x = Math.random()*w;
    this.y = Math.random()*h;
    this.r = Math.random()*1.2+0.3;
    this.vx = (Math.random()-0.5)*0.4;
    this.vy = (Math.random()-0.5)*0.4;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    if(this.x<0||this.x>w) this.vx*=-1;
    if(this.y<0||this.y>h) this.vy*=-1;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(148,163,184,0.55)';
    ctx.fill();
  }
}
for(let i=0;i<80;i++) dots.push(new Dot());
function link(){
  for(let i=0;i<dots.length;i++){
    for(let j=i+1;j<dots.length;j++){
      const dx = dots[i].x-dots[j].x;
      const dy = dots[i].y-dots[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d<100){
        ctx.beginPath();
        ctx.moveTo(dots[i].x,dots[i].y);
        ctx.lineTo(dots[j].x,dots[j].y);
        ctx.strokeStyle = `rgba(148,163,184,${(100-d)/400})`;
        ctx.lineWidth = 0.4;
        ctx.stroke();
      }
    }
  }
}
function tick(){
  ctx.clearRect(0,0,w,h);
  dots.forEach(d=>{d.update();d.draw();})
  link();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
